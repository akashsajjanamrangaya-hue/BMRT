<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureSearch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="decoy-page">
    <main class="decoy-main">
        <h1 class="decoy-title">SecureSearch</h1>

        <form method="POST" class="decoy-search-form" id="decoyForm">
            <input
                type="text"
                id="decoyInput"
                name="decoy_input"
                autocomplete="off"
                placeholder="Search indexed knowledge"
                value="{{ query }}"
                required
            >
            <button type="submit">Search</button>
        </form>

        <section class="decoy-results" id="resultSection">
            {% for item in results %}
                <article class="decoy-result-card">
                    <p class="decoy-url">{{ item.url }}</p>
                    <h3>{{ item.title }}</h3>
                    <p>{{ item.summary }}</p>
                </article>
            {% endfor %}
        </section>

        <nav class="decoy-pagination">
            {% if has_prev %}
                <a href="{{ url_for('decoy', page=page-1) }}">Previous</a>
            {% endif %}
            <span>Page {{ page }}</span>
            {% if has_next %}
                <a href="{{ url_for('decoy', page=page+1) }}">Next</a>
            {% endif %}
        </nav>
    </main>

    <footer class="decoy-footer">
        Academic deception environment for behavior analytics research.
    </footer>

    <script>
        const input = document.getElementById('decoyInput');
        const resultSection = document.getElementById('resultSection');

        // Simple local response feel (visual-only) to mimic instant search interaction.
        input.addEventListener('input', function () {
            resultSection.style.opacity = '0.72';
            clearTimeout(window.resultGlowTimer);
            window.resultGlowTimer = setTimeout(() => {
                resultSection.style.opacity = '1';
            }, 90);
        });
    </script>
</body>
</html>
