<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abnormal Activity Analytics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='analytics.css') }}" />
</head>
<body>
  <main class="analytics-wrap">
    <header class="analytics-header">
      <h1>Abnormal Activity Analytics</h1>
      <p>Monthly trend overview for behavior-based intrusion attempts.</p>
    </header>

    <section class="stats-grid">
      <article class="stat-card">
        <h2>Total Abnormal Attempts</h2>
        <div class="value">{{ total_abnormal }}</div>
      </article>
      <article class="stat-card">
        <h2>Active Months</h2>
        <div class="value">{{ months }}</div>
      </article>
    </section>

    <section class="chart-panel">
      <h2>Monthly Abnormal Trend</h2>
      <canvas id="trendChart" width="980" height="420" aria-label="Monthly abnormal activity chart"></canvas>
    </section>
  </main>

  <script>
    const labels = {{ month_labels | tojson }};
    const values = {{ month_values | tojson }};

    const canvas = document.getElementById('trendChart');
    const ctx = canvas.getContext('2d');

    function drawChart(months, counts) {
      const margin = { top: 40, right: 30, bottom: 70, left: 70 };
      const w = canvas.width - margin.left - margin.right;
      const h = canvas.height - margin.top - margin.bottom;
      const originX = margin.left;
      const originY = margin.top + h;

      // background
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // axes
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(originX, margin.top);
      ctx.lineTo(originX, originY);
      ctx.lineTo(originX + w, originY);
      ctx.stroke();

      if (!months.length) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '16px Segoe UI';
        ctx.fillText('No abnormal activity data available.', originX + 20, originY - 20);
        return;
      }

      const maxVal = Math.max(...counts, 1);
      const points = months.map((m, i) => {
        const x = originX + (i * (w / Math.max(months.length - 1, 1)));
        const y = originY - ((counts[i] / maxVal) * h);
        return { x, y, m, v: counts[i] };
      });

      // grid lines and Y labels
      ctx.font = '12px Segoe UI';
      ctx.fillStyle = '#94a3b8';
      ctx.strokeStyle = 'rgba(148,163,184,0.18)';
      for (let i = 0; i <= 5; i++) {
        const gv = Math.round((maxVal / 5) * i);
        const gy = originY - ((gv / maxVal) * h);
        ctx.beginPath();
        ctx.moveTo(originX, gy);
        ctx.lineTo(originX + w, gy);
        ctx.stroke();
        ctx.fillText(String(gv), originX - 35, gy + 4);
      }

      // line
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      points.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();

      // points + labels
      points.forEach((p) => {
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(String(p.v), p.x - 4, p.y - 10);

        ctx.save();
        ctx.translate(p.x, originY + 20);
        ctx.rotate(-0.45);
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(p.m, 0, 0);
        ctx.restore();
      });

      // axis titles
      ctx.fillStyle = '#93c5fd';
      ctx.font = '13px Segoe UI';
      ctx.fillText('Month', originX + w / 2 - 20, canvas.height - 16);
      ctx.save();
      ctx.translate(18, originY - h / 2 + 20);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('Number of abnormal attempts', 0, 0);
      ctx.restore();
    }

    drawChart(labels, values);
  </script>
</body>
</html>
