<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='fake_google.css') }}" />
</head>
<body data-page="fake_search">
  <header class="topbar">
    <a class="logo-small" href="{{ url_for('fake_google') }}">Gofind</a>
    <div class="search-wrap">
      <input id="qTop" type="text" placeholder="Search" />
      <button id="topSearch" type="button">Search</button>
    </div>
  </header>

  <main class="shell" id="homeShell">
    <h1 class="logo-main">Gofind</h1>
    <div class="hero-search">
      <input id="q" type="text" placeholder="Search the web" />
      <div class="btn-row">
        <button id="searchBtn" type="button">Search</button>
        <button id="luckyBtn" type="button">Lucky</button>
      </div>
    </div>

    <section class="signin-card">
      <h3>Sign in</h3>
      <form id="loginForm">
        <input type="email" name="email" placeholder="Email" />
        <input type="password" name="password" placeholder="Password" />
        <button type="submit">Continue</button>
      </form>
    </section>
  </main>

  <section id="results" class="results hidden"></section>

  <script>
    window.ENABLE_TRACKING = true;

    const pool = [
      { title: 'Developer Documentation Center', url: 'devdocs-hub.net', desc: 'API guides, integration examples, and release updates.' },
      { title: 'Knowledge Repository', url: 'knowledge-stream.org', desc: 'Long-form references and practical deep dives.' },
      { title: 'Community Answers', url: 'forum-lab.io', desc: 'Discussions and practical troubleshooting threads.' },
      { title: 'Learning Portal', url: 'learnroute.app', desc: 'Structured learning tracks and quick-start tutorials.' }
    ];

    function openResults(query) {
      const q = query || 'technology';
      document.getElementById('homeShell').classList.add('hidden');
      const root = document.getElementById('results');
      root.classList.remove('hidden');
      root.innerHTML = '';

      pool.forEach((item, idx) => {
        const node = document.createElement('article');
        node.className = 'result-item';
        node.innerHTML = `
          <a href="#" class="title-link">${q} ${item.title}</a>
          <div class="url-line">${item.url}</div>
          <p>${item.desc}</p>
        `;
        node.querySelector('.title-link').addEventListener('click', (e) => {
          e.preventDefault();
          openResults(`${q} ${idx + 1}`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        root.appendChild(node);
      });
    }

    document.getElementById('searchBtn').addEventListener('click', () => openResults(document.getElementById('q').value.trim()));
    document.getElementById('topSearch').addEventListener('click', () => openResults(document.getElementById('qTop').value.trim()));
    document.getElementById('luckyBtn').addEventListener('click', () => openResults('trending'));
    document.getElementById('loginForm').addEventListener('submit', (e) => { e.preventDefault(); openResults('account'); });
  </script>
  <script src="{{ url_for('static', filename='tracker.js') }}"></script>
</body>
</html>
