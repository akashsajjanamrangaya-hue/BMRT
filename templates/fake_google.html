<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='fake_google.css') }}" />
</head>
<body data-page="fake_search">
  <main class="google-dark-shell">
    <h1 class="g-logo"><span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span></h1>
    <div class="search-row">
      <input id="q" type="text" placeholder="Search" />
      <button id="searchBtn" type="button">Search</button>
    </div>

    <section class="mini-login">
      <h3>Account</h3>
      <form id="loginForm">
        <input type="email" name="email" placeholder="Email" />
        <input type="password" name="password" placeholder="Password" />
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="results" class="results"></section>
  </main>

  <script>
    window.ENABLE_TRACKING = true;
    const resultPool = [
      { title: 'Official Documentation Hub', url: 'docs.portalhub.net', desc: 'Trusted references, release notes and implementation guides.' },
      { title: 'Research Articles', url: 'insight-research.org', desc: 'Technical summaries and trend analysis reports.' },
      { title: 'Community Discussions', url: 'community-threads.net', desc: 'Popular discussions, tutorials, and how-to posts.' },
      { title: 'Learning Resources', url: 'learn-central.io', desc: 'Structured content tracks for practical learning.' }
    ];

    function render(query) {
      const root = document.getElementById('results');
      root.innerHTML = '';
      const q = query || 'technology';
      resultPool.forEach((item, index) => {
        const node = document.createElement('article');
        node.className = 'result-item';
        node.innerHTML = `
          <a href="#" class="title-link">${item.title}</a>
          <div class="url-line">${item.url}</div>
          <p>${item.desc}</p>
          <button class="open-btn" data-query="${q} ${index + 1}">Open</button>
        `;
        root.appendChild(node);
      });

      root.querySelectorAll('.open-btn').forEach((btn) => {
        btn.addEventListener('click', () => render(btn.dataset.query));
      });
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      render(document.getElementById('q').value.trim());
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      render('account center');
    });

    render('web');
  </script>
  <script src="{{ url_for('static', filename='tracker.js') }}"></script>
</body>
</html>
