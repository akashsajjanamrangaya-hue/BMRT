<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
</head>
<body class="cyber-bg" data-page="fake_generic">
  <div class="grid-overlay"></div>
  <main class="gateway-wrap">
    <section class="gateway-card">
      <h1>Nova Hub</h1>
      <p>Discover web, video, and shopping spaces.</p>
      <div class="gateway-form">
        <a class="jump" href="{{ url_for('fake_google') }}">Search</a>
        <a class="jump" href="{{ url_for('fake_youtube') }}">Videos</a>
        <a class="jump" href="{{ url_for('fake_amazon') }}">Shop</a>
      </div>
      <form id="navSearch" class="gateway-form">
        <input type="text" name="q" placeholder="Search inside hub" />
        <button type="submit">Open</button>
      </form>
    </section>
  </main>

  <script>
    window.ENABLE_TRACKING = true;
    document.getElementById('navSearch').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = (new FormData(e.target).get('q') || '').toString().toLowerCase();
      if (q.includes('video')) window.location.href = '{{ url_for("fake_youtube") }}';
      else if (q.includes('shop')) window.location.href = '{{ url_for("fake_amazon") }}';
      else window.location.href = '{{ url_for("fake_google") }}';
    });
  </script>
  <script src="{{ url_for('static', filename='tracker.js') }}"></script>
</body>
</html>
