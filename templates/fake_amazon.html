<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='fake_amazon.css') }}" />
</head>
<body>
  <header class="amz-header">
    <div class="amz-brand">amazon</div>
    <div class="amz-search">
      <input id="amzSearch" type="text" placeholder="Search products" />
      <button id="amzSearchBtn" type="button">Search</button>
    </div>
  </header>

  <main class="amz-main">
    <h2>Today's Recommendations</h2>
    <section id="productGrid" class="product-grid"></section>
  </main>

  <script>
    const products = [
      { name: 'Wireless Mechanical Keyboard', price: '$89.99', rating: '4.6' },
      { name: 'Ultra HD Streaming Camera', price: '$69.49', rating: '4.4' },
      { name: 'Noise Cancel Smart Headset', price: '$129.00', rating: '4.8' },
      { name: 'Portable SSD 1TB', price: '$99.90', rating: '4.7' },
      { name: 'Mesh Wi-Fi Router Pro', price: '$149.00', rating: '4.5' }
    ];

    function renderProducts(filter = '') {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      products
        .filter(p => p.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach((p, idx) => {
          const card = document.createElement('article');
          card.className = 'product-card';
          card.innerHTML = `
            <a href="#" class="product-link">
              <div class="img-box">IMG ${idx + 1}</div>
              <h3>${p.name}</h3>
              <p class="price">${p.price}</p>
              <p class="rating">${p.rating} ★</p>
            </a>
            <button type="button">Add to Cart</button>
          `;
          card.querySelector('.product-link').addEventListener('click', (e) => {
            e.preventDefault();
            renderProducts(p.name.split(' ')[0]);
          });
          grid.appendChild(card);
        });
    }

    document.getElementById('amzSearchBtn').addEventListener('click', () => {
      renderProducts(document.getElementById('amzSearch').value.trim());
    });

    renderProducts();
  </script>
</body>
</html>
