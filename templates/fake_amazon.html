<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketBay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='fake_amazon.css') }}" />
</head>
<body data-page="fake_shop">
  <header class="amz-header">
    <div class="amz-brand">marketbay</div>
    <div class="amz-search">
      <input id="amzSearch" type="text" placeholder="Search products" />
      <button id="amzSearchBtn" type="button">Search</button>
    </div>
  </header>

  <main class="amz-main">
    <h2>Recommended Items</h2>
    <section id="productGrid" class="product-grid"></section>

    <section class="mini-login">
      <h3>Sign in</h3>
      <form id="shopLogin">
        <input type="email" name="email" placeholder="Email" />
        <input type="password" name="password" placeholder="Password" />
        <button type="submit">Continue</button>
      </form>
    </section>
  </main>

  <script>
    window.ENABLE_TRACKING = true;
    const products = [
      { id:'p1', name: 'Wireless Mechanical Keyboard', price: '$89.99', rating: '4.6' },
      { id:'p2', name: 'Ultra HD Streaming Camera', price: '$69.49', rating: '4.4' },
      { id:'p3', name: 'Noise Cancel Smart Headset', price: '$129.00', rating: '4.8' },
      { id:'p4', name: 'Portable SSD 1TB', price: '$99.90', rating: '4.7' },
      { id:'p5', name: 'Mesh Wi-Fi Router Pro', price: '$149.00', rating: '4.5' }
    ];

    function renderProducts(filter = '') {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      products
        .filter(p => p.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach((p, idx) => {
          const card = document.createElement('article');
          card.className = 'product-card';
          card.innerHTML = `
            <a href="#" class="product-link" data-id="${p.id}">
              <div class="img-box">IMG ${idx + 1}</div>
              <h3>${p.name}</h3>
              <p class="price">${p.price}</p>
              <p class="rating">${p.rating} ★</p>
            </a>
            <button type="button" class="cart-btn">Add to Cart</button>
          `;
          grid.appendChild(card);
        });

      grid.querySelectorAll('.product-link').forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          history.pushState({}, '', `?product=${encodeURIComponent(link.dataset.id)}`);
          renderProducts(link.textContent.trim().split(' ')[0]);
        });
      });
    }

    document.getElementById('amzSearchBtn').addEventListener('click', () => {
      renderProducts(document.getElementById('amzSearch').value.trim());
    });

    document.getElementById('shopLogin').addEventListener('submit', (e) => {
      e.preventDefault();
      renderProducts('');
    });

    renderProducts();
  </script>
  <script src="{{ url_for('static', filename='tracker.js') }}"></script>
</body>
</html>
