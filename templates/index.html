<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>An Intelligent Cyber Defense Framework</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="landing">
    <section class="card">
      <h1>An Intelligent Cyber Defense Framework</h1>
      <p>
        Behavior-based intrusion detection and automated attack mitigation using
        rule-driven analysis.
      </p>
      <form action="{{ url_for('analyze') }}" method="post" class="input-group">
        <input type="text" name="keyword" placeholder="Enter: google, youtube, amazon" required />
        <button type="submit">Analyze Input</button>
      </form>
      <div class="examples">
        <div>
          <h3>Normal</h3>
          <ul>
            <li>google</li>
            <li>youtube</li>
            <li>amazon</li>
          </ul>
        </div>
        <div>
          <h3>Abnormal</h3>
          <ul>
            <li>google/</li>
            <li>admin</li>
            <li>../config</li>
          </ul>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
