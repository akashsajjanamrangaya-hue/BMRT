<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligent Web Access Gateway</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
</head>
<body class="cyber-bg">
  <div class="grid-overlay"></div>
  <main class="gateway-wrap">
    <section class="gateway-card">
      <h1>Intelligent Web Access Gateway</h1>
      <p>Fast route lookup for web destinations.</p>
      <form action="{{ url_for('analyze') }}" method="post" class="gateway-form">
        <input type="text" name="keyword" placeholder="Search domain keyword" required />
        <button type="submit">Go</button>
      </form>
      <nav class="shortcut-row">
        <span>google</span>
        <span>youtube</span>
        <span>amazon</span>
      </nav>
    </section>
  </main>
</body>
</html>
