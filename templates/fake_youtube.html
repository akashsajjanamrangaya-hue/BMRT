<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='fake_youtube.css') }}" />
</head>
<body>
  <header class="yt-dark-header">
    <div class="yt-brand">YouTube</div>
    <div class="yt-search-box">
      <input id="ytSearch" type="text" placeholder="Search" />
      <button id="ytSearchBtn" type="button">Search</button>
    </div>
  </header>

  <main class="yt-grid">
    <section class="yt-player-panel">
      <div class="video-player-mock" id="playerArea">VIDEO PREVIEW</div>
      <h2 id="videoTitle">Top Picks for You</h2>
      <p id="videoMeta">Channel Hub • 1.3M views</p>
    </section>
    <aside class="yt-list" id="ytList"></aside>
  </main>

  <script>
    const items = [
      { title: 'Modern Web Security Trends', channel: 'TechScope', views: '1.3M views', duration: '16:44' },
      { title: 'Cloud Automation Explained', channel: 'InfraCraft', views: '920K views', duration: '12:13' },
      { title: 'Frontend Performance Deep Dive', channel: 'RenderLab', views: '670K views', duration: '21:05' },
      { title: 'System Design in Practice', channel: 'CodeArena', views: '480K views', duration: '18:22' }
    ];

    function draw(filter = '') {
      const list = document.getElementById('ytList');
      list.innerHTML = '';
      items
        .filter(v => v.title.toLowerCase().includes(filter.toLowerCase()))
        .forEach(v => {
          const node = document.createElement('a');
          node.href = '#';
          node.className = 'yt-card';
          node.innerHTML = `
            <div class="thumb"><span>${v.duration}</span></div>
            <div>
              <h3>${v.title}</h3>
              <p>${v.channel}</p>
              <p class="muted">${v.views}</p>
            </div>
          `;
          node.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('playerArea').textContent = 'NOW PLAYING';
            document.getElementById('videoTitle').textContent = v.title;
            document.getElementById('videoMeta').textContent = `${v.channel} • ${v.views}`;
          });
          list.appendChild(node);
        });
    }

    document.getElementById('ytSearchBtn').addEventListener('click', () => {
      draw(document.getElementById('ytSearch').value.trim());
    });

    draw();
  </script>
</body>
</html>
